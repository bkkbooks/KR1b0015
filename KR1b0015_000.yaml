body:
  text: 五誥解書類提要臣等謹案五誥解四卷宋楊簡撰簡有慈湖易𫝊已著録昔韓愈稱周誥殷盤佶屈聱牙宋儒如吕祖謙書說亦先釋周誥而後及虞夏商書蓋先通其難通者則其餘易於究尋簡作是書惟解康誥以下五篇亦是意也簡受學於陸九淵如舉新民保赤之政推本於心學又當字說盛行之後喜穿鑿字義為新竒之論措辭亦迂曲委重未能暢所欲言然如康誥言惠不惠懋不懋則歸重於君身服念旬時則疑孔𫝊三月為過久酒誥厥心疾狠指民心而言召誥顧畏于民碞謂民愚而神可畏如碞險洛誥公無困哉謂困有倦勤之意皆能駁正舊文自抒心得至如先卜黎水用鄭康成顧彪之說封康叔時未營洛邑用蘇氏書𫝊之說復子明辟之訓詁圻父薄違之句讀用王氏書義之說又能兼綜羣言不専主一家之學矣此書世久失𫝊文淵閣書目作一冊焦竑經籍志作一卷朱彛尊經義考以為未見今從永樂大典各韻中按條薈萃惟闕梓材一篇餘皆章句完善謹依經文前後釐為四卷乾隆四十六年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:508133a5619a19f27bd24df8d329680c6df8af75b7ccd2e998eb41c358126f46

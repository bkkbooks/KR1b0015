body:
  text: 五誥解卷四宋楊簡撰洛誥周公拜手稽首曰朕復子明辟復即孟子有復於王者之復周禮宰夫待諸臣之復大僕掌諸侯之逆復復謂奏事也辟君也明辟稱成王尊敬之辭王如弗敢及天基命定命豫乃𦙍保大相東土其基作民明辟初議遷都成王如弗敢遽然蓋幼沖之年其質又謙柔也周公於是繼承贊輔大相東土王自此基始作民明辟矣成王初親政即天初命定都即定命也人事所成即天命王如弗敢及天基命之時而遂定其命有疑二未敢之意豫惟乙卯朝至于洛師即召誥乙卯周公朝至于洛時召公已命庶殷攻位有衆故曰師我卜河朔黎水我乃卜澗水東瀍水西惟洛食我又卜瀍水東亦惟洛食伻來以圖及獻卜召誥序曰成王在豐欲宅洛邑使召公先相宅則知是已卜河朔黎水不吉矣此篇方稱我卜河朔黎水乃叙及已前事召誥曰太保朝至于洛卜宅厥既得卜則經營乃以庶殷攻位于洛汭則已卜澗瀍之間洛水之北矣而此乃曰我乃卜澗水東瀍水西惟洛食者亦叔前事也周公使召公往卜亦可言我也孔安國曰我使人卜河北黎水不吉又卜澗瀍之間孔意亦謂使召公爾鄭康成謂殷民懷土憚遷故先卜河朔黎水不吉乃卜洛顧氏亦用其說按史記武王初定洛邑而洛誥周公先卜河朔黎水者公未敢遽違殷民懷土之情歟孔安國謂卜必先墨畫龜然後灼之兆順食墨又卜瀍水東將定下都遷殷頑民遣使以所卜地圖及獻所卜吉兆來告成王簡據洛誥之文則又卜瀍水東其召公併卜歟或周公至洛而併卜歟或周公至洛而始卜歟然皆本于周公之命也伻使也書序云成王欲宅洛邑使召公先相宅作召誥召公既相宅周公往營成周使來告卜作洛誥成周既成遷殷頑民周公以王命誥作多士觀書序及書未見王城成周之為二左氏乃有王城成周之殊孔子作經必不如左氏之數更其辭以為文而已蓋周初瀍水東西皆曰成周至春秋時始分瀍西之城曰王城瀍東之城曰成周孔子因魯史而書昭公三十二年敬王使富辛與石張如晉請城成周曰昔成王合諸侯城成周以為東都然則瀍水之東成王周公之時已城之矣杜預云子朝之亂其餘黨多在王城敬王畏之徙都成周周紀或為東周說韓王曰西周故天子之國多名器重寶王拜手稽首曰公不敢不敬天之休來相宅其作周匹休公既定宅伻來來視豫卜休恆吉我二人共貞公其以豫萬億年敬天之休拜手稽首誨言周公雖歸政而成王尊敬不替曰匹休又曰我二人共貞亦相與有成之意也休美也恆久也可長久故吉王請公誨以言周公曰王肇稱殷禮祀于新邑咸秩無文豫齊百工伻從王于周豫惟曰庶有事今王即命曰記功宗以功作元祀惟命曰汝受命篤弼丕視功載乃汝其悉自教工孺子其朋孺子其朋其往無若火始焰焰厥攸灼敘弗其絶公曰王始舉盛禮祀于新邑其舊文所無者亦皆秩而祀之肇始也稱舉也殷盛也豫整齊百工使從王于周豫惟曰庶有施行之事意其必善而今王即百工而命曰當記功于宗廟以功作元祀意謂功德積纍其大者得列于元祀盤庚曰爾祖其從與享之謂配享也又命曰汝受命篤志弼我其意嚮篤厚如此今我大閲視爾記功載籍而所記者乃悉汝所自教之官皆汝私人受教於汝者非我所齊百工也於是周公乃訓責成王曰孺子其有朋黨乎孺子惟與爾朋往乎無若火始焰焰其所灼已有次叙而弗能止絶乎其朋雖未至於姦惡而與周公異趣矣此放逸之漸不可長也厥若彞及撫事如豫惟以在周工往新邑伻嚮即有僚明作有功惇大成裕汝永有辭彞平常也其平常無事時及臨事時皆當如我在周時百工也蓋此百工皆齊周公所精擇不可棄也今往新邑使嚮有官僚者即就用之明察其有功而作之作進用也宜惇厚寬大以成寬裕之德蓋慮成王不知周公所齊百工之善而輕苛責之故教王寬厚有容則永有譽公曰已汝惟沖子惟終汝其敬識百辟享亦識其有不享享多儀儀不及物惟曰不享惟不役志于享凡民惟曰不享惟事其爽侮周公知成王未明曉知其必為百辟諸侯所惑羣臣多周公所擇而諸侯皆仍其舊雖文王武王德化丕變而滅國五十知不可訓誨者亦多罪不至於滅者亦未皆誠心於善故有享上多儀而誠不及物者易曰言有物謂誠實也儀不及於誠謂之實不享上可也以其不用心志于享心不享上儀雖享上凡民皆曰不享此等不誠之人明明是相侮是謂爽侮周公善形容小人情狀謂此等人惟専事爽侮今俗謂之對面相侮弄蓋邪正之分率於誠不誠見之凡民皆知豈王者而不知乃惟孺子頒朕不暇聽朕教汝于棐民彝汝乃是不蘉乃時惟不永哉篤敘乃正父罔不若豫不敢廢乃命汝往敬哉兹豫其明農哉彼裕我民無遠用戾孺子惟頒賜朕不暇聽朕教汝輔民彝性之道汝乃若是不明是不永哉言天命必不永也輔民彝之道公與成王講之熟矣君天下者厥職輔民彝性而已無他事也歸政以來必申明素教而成王復有未明故又言民有常性本善惟上之人左右之使善者知所勸惡者知所懲而已今成王所記功乃自教之官雖非姦惡然非周公所齊百工周公所用者成王所不記則善者亦無所勸姦惡有可進之萌則民之常性將亂矣王者當輔之今反亂之正父正人之老成者故司馬曰圻父司徒曰農父司空曰宏父亦明老成周公所用多老成汝宜篤意叙用之凡正父無不順豫也若順也言與周公同道正父亦不敢廢汝命乃汝也君命臣行義也正父必遵義恐成王有疑畏正父或不從命故周公云汝往新邑敬哉兹豫其辨明篤切哉農厚也篤厚也即洪範農用八政之農彼正父能寬裕我民汝無遠之而與之乖戾王若曰公明保豫沖子公稱丕顯德以豫小子揚文武烈奉答天命和恆四方民居師惇宗將禮稱秩元祀咸秩無文惟公德明光于上下勤施于四方旁作穆穆迓衡不迷文武勤教豫沖子夙夜毖祀王曰公功棐迪篤罔不若時若順也自殷周以來開端多用王若曰足以明順道而亦有别於更端特異其辭之義後言退即辟于周則知成王方至洛邑而言故更端曰公明保豫沖子謂公保護我教誨明白故曰明保公所稱說者大顯德也以用也見於施行也以豫小子順文武之德而揚其烈以此奉答天命恆久久和四方民故能使衆心安定師衆也居者止而不去也衆心不離也惇厚宗廟及禮將及也稱舉元祀有秩序不亂雖舊典無文於義當祀者咸次叙祀之惟公德明光于上下蓋習聞公素講而用其言自古諸賢習聞德有明光之說而不知實有明光者此明德之光惟可自覺誠自信如日月如水鑑無所思為而光明畢照然則奚止至于上下亦臨照四方也衡平也迓迎也言將平也豫沖子惟夙夜致謹祭祀毖致謹也其餘皆公之所為公之功也此一節惟深感謝周公之功德教誨良久又曰公之功在乎棐輔我迪行篤切無不若是時是也兹周公責切篤至成王心服言公素教無不如此王曰公豫小子其退即辟于周命公後四方迪亂未定于宗禮亦未克敉公功迪將其後監我士師工誕保文武受民亂為四輔命公後者為周公立後謂封伯禽於魯也言豫小子往洛邑即當行封建之禮蓋以公之去留為重也四方雖已迪治其亂而周之宗禮不定則無以垂法後世恐公之大功亦未能敉寧也公惟以典禮為治垂于後世以為士衆建功者之監則可大保我文武治民之輔佐矣四輔舊說為四維之輔惟周公足以當之周公作官禮史不詳其何時以書考之當在洛邑告成之後也王曰公定豫往己公功肅將祗歡公無困哉我惟無斁其康事公勿替刑四方其世享王既留公以定禮又言公能成其前功則執事皆知祗歡而相與以有成也言祗歡而先以肅將言涖事以敬舍敬無以集事也公無困哉漢書作公無困我言公母以我而告困也困者倦勤于事之意成王所以受周公忠誨者祗在無斁周公所以儀型四方者止在弗替蓋成王能知周公之心體備于身君以無斁為本下有弗替之功是君臣之極盛也其世享承上命公後而言周公拜手稽首曰王命豫來承保乃文祖受命民越乃光烈考武王𢎞朕恭孺子來相宅其大惇典殷獻民亂為四方新辟作周恭先周公既承王命因上述祖考之德祈王開基于後世也民為文王受命之民惡可不思惠保乎武王末受命其所以貽于後王者以能充夫我恭敬之心以保民為輔相也王今相宅既定將考定典禮撫殷遺民為四方新主矣其所以承先業裕後昆者不外乎恭蓋堯舜所以為後世帝王之法者惟以恭為本故周公屢以為言曰其自時中乂萬邦咸休惟王有成績豫旦以多子越御事篤前人成烈答其師作周孚先周公良久而再言故書曰自是居土中而乂治多子謂周公比肩在朝諸賢及小官御事因前人已成之烈而篤守之以此答其衆師衆也篤者篤守前人之德故能守其成烈而不失也惟篤其德故以之答其衆心所望為周孚信之先因前者成王疑周公故此言孚以默感成王之心王今信矣及孚先助明公心以堅王心考朕昭子刑乃單文祖德伻來毖殷乃命寧刑法也單盡也觀朕所以昭示子之法乃盡文祖德使王來新邑致謹于殷地殷民則天命寧矣毖致謹也即禹克艱臯陶兢兢之意豫以秬鬯二卣曰明禋拜手稽首休享豫不敢宿則禋于文王武王周禮有鬱鬯有秬鬯秬黑黍黑黍為鬯酒秬鬯不和鬱金者卣中尊不用鬱鬯周公以臣禮降等歟惟以精明禋祀不在牲物上言篤前人成烈又曰單文祖德繼言此明禋于文王武王又曰不敢宿又曰休享言致其善享即前言告成王之善善善無二孔子曰孝弟之至通於神明光于四海無所不通周公明禋文武用堅明訓凡祀必先齊今公不敢宿亦敬也聖人心常精一雖不齊如齊他人則不可繼言惠篤叙無有遘自疾則知禋文武實堅明訓㫖惠篤敘無有遘自疾萬年厭于乃德殷乃引考王伻殷乃承敘萬年其永觀朕子懷德公告王當惠順篤志凡百有叙而無亂無自搆成其疾也使萬年厭足于汝德言洪德備足流澤萬年則此新邑之殷乃長久有成引長也考成也王當使殷之臣民奉承有叙不亂至于萬年朕子謂伯禽常與成王同處故公因及之意謂公老矣不復永懷王德惟朕子永懷王德戊辰王在新邑蒸祭歲文王騂牛一武王騂牛一王命作册逸祝册惟告周公其後王賔殺禋咸格王入太室祼王命周公後作册逸誥在十有二月惟周公誕保文武受命惟七年春秋魯文公十三年公羊𫝊曰周公拜乎前魯公拜乎後曰生以養周公死以為周公主禮祭必有賓祭禮君牽牲周禮冢宰贊王牲事意者賓其周公乎自王賓殺禋至逸告正祭行事也咸格謂凡與祭者畢至也孔安國曰自戊辰以下史所終述
